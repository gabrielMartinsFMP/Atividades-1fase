<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            height: 100vh;
            margin: 0;
            padding: 0;
            align-items: center;
            justify-content: center;
            display: flex;
            background-color: rgb(157, 157, 157);
        }

        h1 { 
            background-image:
                linear-gradient(90deg, rgba(80, 255, 197, 0.55), rgba(64, 233, 177, 0.55), rgba(40, 217, 182, 0.55)),
                url('pngtree-abstract-cloudy-background-beautiful-natural-streaks-of-sky-and-clouds-red-image_15684333.jpg');
            background-size: cover;
            background-position: center;
            width: 30%;
            text-align: center;
            height: 15%;
            justify-content: center;
            align-items: center;
            margin: 20px;
            padding: 15px;
            display: flex;
            font-size: 42px;
            border-radius: 20px;
            border: 3px solid rgb(69, 69, 69);
            color: rgb(69, 69, 69);
            gap: 10px;
            box-shadow: 10px 10px 5px rgba(128, 128, 128, 0.223);
            transition: color 300ms ease-in-out, border 300ms ease-in-out, scale 300ms ease-in-out, background-image 300ms ease-in-out;
        }

        h1:hover {
            background-image:
                linear-gradient(90deg, rgba(255, 165, 80, 0.55), rgba(233, 145, 64, 0.55), rgba(217, 126, 40, 0.55)),
                url('pngtree-abstract-cloudy-background-beautiful-natural-streaks-of-sky-and-clouds-red-image_15684333.jpg');
            cursor: pointer; /* Optional: makes it feel more like a button */
            color: white;
            border: 5px solid white;
            scale: 1.1;
            box-shadow: 10px 10px 5px rgba(255, 255, 255, 0.253);
        }

        
    </style>
</head>
<body>
    
    <h1>
        T I T U L O
    </h1>
    
    
</body>
</html>
